[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holodjango-deepid"
version = "0.0.1"
description = "Django-side identity authority adapter for hc_deepid — issues first-sync tokens and exposes stable external IDs for Holochain multi-device identity."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nuruddin Asyhadie" }
]
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2"
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 2 - Pre-Alpha",
]

[project.urls]
Homepage = "https://github.com/Nuruddindev/holodjango_deepid"
"Related project" = "https://github.com/Nuruddindev/hc_deepid"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
]

[tool.setuptools.packages.find]
include = ["holodjango_deepid*"]
